# Staged coexistence gateway. The legacy application listens on legacy:3000,
# while the new React and control-plane services run independently.
map $cookie_mirotalk_platform $join_upstream {
  default http://legacy:3000;
  next http://web:8080;
}

server {
  listen 8080;
  server_name _;

  location /api/v2/ {
    proxy_pass http://control-plane:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /control/socket.io/ {
    proxy_pass http://control-plane:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  # QA/pilot entrypoint. The response sets the cohort cookie and then returns
  # to the canonical URL, so invite links remain /join/:roomId.
  location ~ ^/next/join/(.+)$ {
    add_header Set-Cookie "mirotalk_platform=next; Path=/; Secure; HttpOnly; SameSite=Lax" always;
    return 302 /join/$1$is_args$args;
  }

  location ~ ^/join/ {
    proxy_pass $join_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://legacy:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
