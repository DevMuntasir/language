apiVersion: v1
kind: Namespace
metadata:
  name: mirotalk
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mirotalk-platform
  namespace: mirotalk
data:
  NODE_ENV: production
  CONTROL_PORT: "3100"
  PUBLIC_APP_URL: https://meet.example.com
  CORS_ORIGIN: https://meet.example.com
  LIVEKIT_URL: wss://media.example.com
  LIVEKIT_INTERNAL_URL: http://livekit-server:7880
  REDIS_URL: redis://redis-ha:6379
  S3_BUCKET: mirotalk-ephemeral
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mirotalk
spec:
  replicas: 3
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: registry.example.com/mirotalk/web:VERSION
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: mirotalk
spec:
  selector: { app: web }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: mirotalk
spec:
  replicas: 3
  selector:
    matchLabels: { app: control-plane }
  template:
    metadata:
      labels: { app: control-plane }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: control-plane
          image: registry.example.com/mirotalk/control-plane:VERSION
          ports:
            - { name: http, containerPort: 3100 }
          envFrom:
            - configMapRef: { name: mirotalk-platform }
            - secretRef: { name: mirotalk-platform-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: mirotalk
spec:
  selector: { app: control-plane }
  ports:
    - { name: http, port: 3100, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: control-plane
  namespace: mirotalk
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: control-plane }
  minReplicas: 3
  maxReplicas: 30
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: mirotalk
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai-worker }
  template:
    metadata:
      labels: { app: ai-worker }
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: ai-worker
          image: registry.example.com/mirotalk/ai-worker:VERSION
          envFrom:
            - configMapRef: { name: mirotalk-platform }
            - secretRef: { name: mirotalk-platform-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control-plane
  namespace: mirotalk
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: control-plane }
