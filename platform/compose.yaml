services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mirotalk
      POSTGRES_PASSWORD: mirotalk
      POSTGRES_DB: mirotalk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirotalk"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "127.0.0.1"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"
      - "7881:7881"
      - "40000-40100:40000-40100/udp"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro

  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      NODE_ENV: development
      CONTROL_PORT: 3100
      PUBLIC_APP_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://mirotalk:mirotalk@postgres:5432/mirotalk
      REDIS_URL: redis://redis:6379
      CONTROL_TOKEN_SECRET: local-development-secret-change-before-production
      WEBHOOK_ENCRYPTION_KEY: local-development-webhook-encryption-key
      ADMIN_API_KEY: local-development-admin-key
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecretdevsecretdevsecretdevsecret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REALTIME_TRANSLATION_MODEL: ${REALTIME_TRANSLATION_MODEL:-gpt-realtime-translate}
      TRANSLATOR_AGENT_NAME: ${TRANSLATOR_AGENT_NAME:-mirotalk-translator}
    ports:
      - "3100:3100"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - control-plane
    ports:
      - "5173:8080"

  ai-worker:
    build: ./apps/ai-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      STORAGE_BACKEND: filesystem
      LOCAL_STORAGE_PATH: /data/ephemeral
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-http://host.docker.internal:8000/v1}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-gpt-transcribe}
    volumes:
      - ephemeral-data:/data/ephemeral

  translator-worker:
    profiles: ["translation"]
    build: ./apps/translator-worker
    depends_on:
      livekit:
        condition: service_started
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecretdevsecretdevsecretdevsecret
      TRANSLATOR_AGENT_NAME: ${TRANSLATOR_AGENT_NAME:-mirotalk-translator}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVEN_API_KEY: ${ELEVEN_API_KEY:-}
      TRANSLATION_STT_MODEL: ${TRANSLATION_STT_MODEL:-gpt-live-transcribe}
      TRANSLATION_LLM_MODEL: ${TRANSLATION_LLM_MODEL:-gpt-5.6-luna}
      TRANSLATION_TTS_MODEL: ${TRANSLATION_TTS_MODEL:-eleven_v3_conversational}
      TRANSLATION_BN_VOICE_ID: ${TRANSLATION_BN_VOICE_ID:-}

volumes:
  postgres-data:
  redis-data:
  ephemeral-data:
